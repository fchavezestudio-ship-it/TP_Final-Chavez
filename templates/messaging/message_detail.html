{% extends 'base.html' %}
{% block title %}{{ msg.subject }}{% endblock %}
{% block content %}
<div class="container">
    <p class="breadcrumb"><a href="{% url 'inbox' %}">Mensajes</a> <span>/</span> {{ msg.subject }}</p>
    <div style="background:white;border:1px solid var(--border);border-radius:8px;padding:2rem">
        <h2 style="font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:.5rem">{{ msg.subject }}</h2>
        <p class="text-muted" style="font-size:.875rem;margin-bottom:1.5rem">
            De: <strong>{{ msg.sender.username }}</strong> &nbsp;&rarr;&nbsp; <strong>{{ msg.receiver.username }}</strong>
            &middot; {{ msg.sent_at|date:"d/m/Y H:i" }}
        </p>
        <p style="line-height:1.8;white-space:pre-wrap">{{ msg.body }}</p>
    </div>
    <div class="form-actions mt-2">
        <a href="{% url 'inbox' %}" class="btn btn-secondary">← Volver</a>
        <a href="{% url 'message_delete' msg.pk %}" class="btn btn-danger">🗑 Eliminar</a>
    </div>
</div>
{% endblock %}
